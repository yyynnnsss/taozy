<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎵 云音乐播放器</title>
<style<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎵 云音乐播放器</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: #fff;
  min-height: 100vh;
  /* 给底部播放器预留空间，兼容刘海底部安全区 */
  padding-bottom: calc(170px + env(safe-area-inset-bottom));
}

.header {
  padding: 18px 16px;
  text-align: center;
  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header h1 { font-size: 20px; font-weight:700; letter-spacing:1px; }
.header p { font-size:12px; color:#aab; margin-top:4px; }

.search-wrap {
  padding: 14px 12px 6px;
}
.search-box {
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
}
.search-box input {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  border: none;
  border-radius: 24px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 15px;
  outline: none;
  text-align: center;
  transition: background 0.2s;
}
.search-box input:focus {
  background: rgba(255,255,255,0.18);
}
.search-box input::placeholder { color:#889; }
.search-box button {
  flex-shrink: 0;
  padding: 0 14px;
  border: none;
  border-radius: 24px;
  background: #e94560;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.search-box button:active { opacity:0.8; }

/* 歌手弹窗 */
.singer-modal-mask {
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.7);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding: 12px;
}
.singer-modal-mask.open { display:flex; }

.singer-modal {
  width:100%;
  max-width:420px;
  max-height: 70vh;
  background:#1f2a44;
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.singer-modal-head {
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.singer-modal-head h3 { font-size:16px; }
.singer-close-btn {
  background:none;
  border:none;
  color:#aaa;
  font-size:22px;
  cursor:pointer;
  padding:4px 8px;
}
/* 响应式自动列数，最小宽度70px */
.singer-list-wrap {
  padding:12px;
  overflow-y:auto;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
  gap:8px;
}
.singer-item {
  padding: 10px 4px;
  border-radius:10px;
  background:rgba(255,255,255,0.06);
  cursor:pointer;
  transition:background 0.2s;
  text-align:center;
  font-size:12px;
  word-break:break-all;
  min-height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.singer-item:active {
  background:rgba(255,255,255,0.14);
}

.platform-row {
  display:flex;
  gap:8px;
  padding:10px 12px 4px;
  overflow-x:auto;
}
.platform-tag {
  flex-shrink:0;
  padding:6px 14px;
  border-radius:16px;
  background:rgba(255,255,255,0.1);
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
  border:1px solid transparent;
  transition:all 0.2s;
}
.platform-tag.active {
  background:#e94560;
  border-color:#ff6b7d;
}
.platform-tag:active { opacity:0.75; }

.result-list {
  padding:10px 12px;
}

.pagination-wrap {
  padding:10px 12px 20px;
  display:none;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.pagination-wrap button {
  padding:7px 14px;
  border:none;
  border-radius:18px;
  background:rgba(255,255,255,0.12);
  color:#fff;
  cursor:pointer;
  transition:background 0.2s;
}
.pagination-wrap button:active {
  background:#e94560;
  /* 删除原错误 display:none */
}
.pagination-wrap button:disabled {
  background:rgba(255,255,255,0.05);
  color:#667;
  cursor:not-allowed;
  opacity:0.4;
}
.page-text {
  font-size:14px;
  color:#aab;
}

.song-item {
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(255,255,255,0.06);
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:10px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.04);
  transition: all 0.2s ease;
}
.song-item:active {
  background:rgba(255,255,255,0.12);
}
.song-item.playing {
  border-color:#e94560;
  background:rgba(233,69,96,0.18);
}
.song-index-num {
  width:26px;
  text-align:center;
  font-size:14px;
  color:#99a;
  flex-shrink:0;
}
.song-cover {
  width:44px;
  height:44px;
  border-radius:8px;
  object-fit:cover;
  flex-shrink:0;
  background:rgba(255,255,255,0.1);
}
.song-info {
  flex:1;
  min-width:0;
}
.song-title {
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-artist {
  font-size:12px;
  color:#99a;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.icon-btn {
  background:none;
  border:none;
  color:#dde;
  font-size:18px;
  cursor:pointer;
  padding:10px;
  flex-shrink:0;
  transition:color 0.2s,opacity 0.2s;
}
.icon-btn:active {
  color:#ff6b7d;
}
.icon-btn:disabled {
  opacity:0.35;
  pointer-events:none;
}

/* 底部播放器 */
.player-bar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(15,20,35,0.97);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.08);
  padding:12px 14px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  z-index:100;
}
.player-top {
  display:flex;
  align-items:center;
  gap:10px;
}
.player-ctrl-btn {
  background:none;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  transition:opacity 0.2s;
  flex-shrink:0;
  padding:6px;
}
.player-ctrl-btn:active {
  opacity:0.7;
}
.player-ctrl-btn.play {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#e94560;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.player-info {
  flex:1;
  min-width:0;
  text-align:center;
}
.player-song-title {
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.player-song-artist {
  font-size:11px;
  color:#99a;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.progress-wrap {
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
}
.progress-time {
  font-size:11px;
  color:#99a;
  width:38px;
  text-align:center;
  flex-shrink:0;
}
.progress-bar {
  flex:1;
  height:7px;
  border-radius:4px;
  background:rgba(255,255,255,0.15);
  position:relative;
  cursor:pointer;
}
.progress-bar-fill {
  height:100%;
  border-radius:4px;
  background:linear-gradient(90deg,#e94560,#ff6b7d);
  width:0%;
  transition:none;
}

/* 修复：播放器控制按钮，取消display:none */
.player-btns {
    display: flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:6px;
}
.controls-drawer {
  display:none;
  opacity:0;
  transition:opacity 0.25s ease;
}
.controls-drawer.open {
  display:block;
  opacity:1;
  margin-top:10px;
  border-top:1px solid rgba(255,255,255,0.08);
  padding-top:10px;
}
.control-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.control-row label {
  font-size:12px;
  color:#aab;
  width:56px;
  flex-shrink:0;
}
.control-row input[type=range] {
  flex:1;
  -webkit-appearance:none;
  height:4px;
  border-radius:2px;
  background:rgba(255,255,255,0.2);
  outline:none;
}
.control-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#e94560;
  cursor:pointer;
}
.quality-chips {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.quality-chip {
  padding:4px 10px;
  border-radius:12px;
  background:rgba(255,255,255,0.1);
  font-size:11px;
  cursor:pointer;
  border:1px solid transparent;
  transition:all 0.2s;
}
.quality-chip.active {
  background:#e94560;
  border-color:#ff6b7d;
}
.quality-chip:active { opacity:0.7; }

.notice { padding:20px; text-align:center; color:#889; font-size:14px; }
.loading { text-align:center; color:#aab; padding:20px; }
.temp-notice {
  color:#e94560;
  animation:fadeInOut 3.5s forwards;
  padding:8px 12px;
  text-align:center;
  font-size:14px;
}
@keyframes fadeInOut{
  0% {opacity:0;transform:translateY(-8px);}
  10% {opacity:1;transform:translateY(0);}
  85% {opacity:1;}
  100% {opacity:0;}
}
.spacer { height:170px; }
#scrollSentinel{
  height:1px;
  margin:20px 0;
}

/* 下载弹窗 底部弹出 */
.dl-modal-mask {
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.65);
  z-index:999;
  display:none;
  align-items:flex-end;
  justify-content:center;
  opacity:0;
  transition:opacity 0.2s;
}
.dl-modal-mask.open {
  display:flex;
  opacity:1;
}
.dl-modal {
  width:100%;
  max-width:480px;
  background:#1f2a44;
  border-radius:20px 20px 0 0;
  padding:18px 18px calc(30px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,0.5);
  transform:translateY(100%);
  transition:transform 0.25s ease-out;
}
.dl-modal-mask.open .dl-modal{
  transform:translateY(0);
}
.dl-modal-title{
  font-size:17px;
  font-weight:700;
  text-align:center;
  margin-bottom:12px;
}
.dl-modal-songname{
  text-align:center;
  font-size:13px;
  color:#aab;
  margin-bottom:16px;
  word-break:break-all;
}
.dl-quality-item{
  padding:14px 14px;
  background:rgba(255,255,255,0.07);
  border-radius:14px;
  margin-bottom:10px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.06);
  text-align:center;
  transition:background 0.2s;
}
.dl-quality-item:active{
  background:rgba(255,255,255,0.14);
}
.dl-cancel{
  margin-top:8px;
  text-align:center;
  padding:12px;
  color:#99a;
  font-size:14px;
  cursor:pointer;
  border-radius:12px;
  transition:background 0.2s;
}
.dl-cancel:active{
  background:rgba(255,255,255,0.1);
}

/* ----------------媒体查询适配---------------- */
/* 超小手机屏幕 */
@media (max-width: 360px) {
  body {
    padding-bottom: calc(180px + env(safe-area-inset-bottom));
  }
  .spacer { height:180px; }
  .search-box { gap:6px; }
  .search-box button { padding:0 10px; font-size:13px; }
  .song-cover { width:40px; height:40px; }
  .player-ctrl-btn.play { width:44px;height:44px;font-size:18px; }
  .player-btns { gap:8px; }
}

/* 横屏手机适配，缩小播放器高度 */
@media (orientation: landscape) {
  body {
    padding-bottom: calc(130px + env(safe-area-inset-bottom));
  }
  .spacer { height:130px; }
  .player-bar {
    padding:8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .player-btns {
    margin-top:6px;
    gap:10px;
  }
  .player-ctrl-btn.play {
    width:42px;
    height:42px;
    font-size:17px;
  }
}
</style>
</head>
<body>
<div class="search-wrap">
  <div class="search-box">
    <button id="openSingerBtn">歌手</button>
    <input id="searchInput" type="text" placeholder="输入歌曲名 / 歌手 / 关键词" />
    <button id="doSearch" onclick="resetAndSearch()">搜索</button>
  </div>
</div>
<!-- 热门歌手弹窗 -->
<div class="singer-modal-mask" id="singerModalMask">
  <div class="singer-modal">
    <div class="singer-modal-head">
      <h3>🔥歌手</h3>
      <button class="singer-close-btn" id="closeSingerModal">×</button>
    </div>
    <div class="singer-list-wrap" id="singerListBox">
      <!-- js渲染歌手列表 -->
    </div>
  </div>
</div>
<div id="resultList" class="result-list">
  <div class="notice">🔍 输入关键词开始搜索音乐</div>
  <div id="scrollSentinel"></div>
</div>
<div class="pagination-wrap">
  <button id="prevPageBtn" onclick="prevPage()" disabled>⬅️ 上一页</button>
  <span class="page-text" id="pageInfo">第 1 页</span>
  <button id="nextPageBtn" onclick="nextPage()">下一页 ➡️</button>
</div>
<div class="spacer"></div>
<div class="player-bar">
  <div class="player-top">
    <button class="player-ctrl-btn" style="font-size:18px;" onclick="toggleDrawer()">⚙️</button>
    <div class="player-info">
      <div class="player-song-title" id="nowTitle">未在播放</div>
      <div class="player-song-artist" id="nowArtist"></div>
    </div>
    <button class="player-ctrl-btn" style="font-size:22px;" onclick="downloadCurrentSong()">⬇️</button>
  </div>
  <div class="progress-wrap">
    <span class="progress-time" id="curTime">0:00</span>
    <div class="progress-bar" id="progressBar">
        <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <span class="progress-time" id="totalTime">0:00</span>
  </div>
  <div class="player-btns">
    <button class="player-ctrl-btn" id="modeBtn" onclick="togglePlayMode()" title="播放模式">🔁</button>
    <button class="player-ctrl-btn" style="font-size:22px;" id="prevSong" onclick="prevSong()">⏮️</button>
    <button class="player-ctrl-btn play" id="playBtn" onclick="togglePlay()">▶️</button>
    <button class="player-ctrl-btn" style="font-size:22px;" id="playNext" onclick="nextSong()">⏭️</button>
  </div>
  <div class="controls-drawer" id="controlsDrawer">
    <div class="control-row">
      <label>🔊 音量</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="100" oninput="setVolume(this.value)" />
      <span id="volumeVal" style="font-size:12px;color:#aab;width:32px;text-align:right;">100%</span>
    </div>
    <div class="control-row">
      <label>🎚️ 音质</label>
      <div class="quality-chips" id="qualityChips"></div>
    </div>
    <div style="text-align:center; font-size:11px; color:#556; margin-top:6px;">br: 128 / 192 / 320 / 740 / 999</div>
  </div>
</div>
<div class="dl-modal-mask" id="dlModalMask">
  <div class="dl-modal">
    <div class="dl-modal-title">选择下载音质</div>
    <div class="dl-modal-songname" id="dlModalSongName"></div>
    <div id="dlQualityList"></div>
    <div class="dl-cancel" onclick="closeDlModal()">取消</div>
  </div>
</div>
<audio id="audio">
<script>
/* =========================================================
 * 云音乐播放器
 * ========================================================= */
// 热门歌手数据，可以自行增删
const HOT_SINGERS = [
  "热歌","抖音","流行","国风","经典","伤感","老歌","DJ串烧","影视","动漫","粤语","雨声","纯音乐","睡眠","薛之谦","蔡琴","刘若英","刘德华","黎明","陈奕迅","陈慧琳","邓紫棋","王菲","周华健","张韶涵","周杰伦","周深","张靓颖","刀郎","张学友","张宇","鱼蛋","阿梨粤","亮声open","程响","徐怀钰","海来阿木","林子祥","郭富城","任贤齐","魏新雨","崔子格","谢霆锋","冷漠","杨钰莹","孙楠","韩红","伍佰","张信哲","阿杜","欢子","郑源","林忆莲","林俊杰","孙燕姿","张杰","李荣浩","王心凌","SHE","李翊君","李丽芬","郑少秋","屠洪刚","张惠妹","萧敬腾","萧亚轩","羽泉","许巍","王杰","朴树","王蓉","花僮","林子祥","甄妮","陈慧娴","郑秀文","蔡依林","花姐","阿悠悠","周慧敏","李克勤","黄安","那英","凤凰传奇","动力火车","杨坤","汪峰","许嵩","BEYOND","周传雄","张碧晨","周深","王源","王俊凯","易烊千玺","徐良",
  "汪苏泷","孙燕姿","五月天","陶喆"
];
//歌手弹窗逻辑
const singerMask = document.getElementById('singerModalMask');
const singerListBox = document.getElementById('singerListBox');
//渲染歌手列表
function renderSingerList(){
  singerListBox.innerHTML = '';
  HOT_SINGERS.forEach(name=>{
    const div = document.createElement('div');
    div.className = 'singer-item';
    div.textContent = name;
    div.onclick = ()=>{
      //填入搜索框并搜索
      document.getElementById('searchInput').value = name;
      closeSingerModal();
      resetAndSearch();
    }
    singerListBox.appendChild(div);
  })
}
function openSingerModal(){
  singerMask.classList.add('open');
}
function closeSingerModal(){
  singerMask.classList.remove('open');
}
document.getElementById('openSingerBtn').addEventListener('click',openSingerModal);
document.getElementById('closeSingerModal').addEventListener('click',closeSingerModal);
singerMask.addEventListener('click',(e)=>{
  if(e.target === singerMask) closeSingerModal();
})
// ========== 页面visibilitychange ==========
document.addEventListener('visibilitychange',()=>{
});
let prevAudioOutputList = [];
async function getAudioOutputDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d => d.kind === "audiooutput");
  } catch (e) {
    return [];
  }
}
async function onMediaDeviceChange() {
  const nowList = await getAudioOutputDevices();
  const hadHeadphoneBefore = prevAudioOutputList.some(item => /headphone|耳机/i.test(item.label));
  const hasHeadphoneNow = nowList.some(item => /headphone|耳机/i.test(item.label));
  if (hadHeadphoneBefore && !hasHeadphoneNow) {
    if(!audio.paused){
      audio.pause();
      isPlaying = false;
      updatePlayBtn();
    }
  }
  prevAudioOutputList = nowList;
}
async function initHeadphoneDetect() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
    return;
  }
  try {
    prevAudioOutputList = await getAudioOutputDevices();
    navigator.mediaDevices.addEventListener("devicechange", onMediaDeviceChange);
  } catch (err) {
  }
}
let isLoadingMore = false;
let scrollObserver = null;
function initScrollInfinite(){
  const sentinel = document.getElementById("scrollSentinel");
  if(!sentinel) return;
  if(scrollObserver) scrollObserver.disconnect();
  scrollObserver = new IntersectionObserver((entries)=>{
    const entry = entries[0];
    if(entry.isIntersecting && !isLoadingMore && !nextPageBtn.disabled){
      const kw = document.getElementById("searchInput").value.trim();
      if(!kw) return;
      isLoadingMore = true;
      nextPage();
    }
  },{
    rootMargin:"250px 0px",
    threshold:0
  });
  scrollObserver.observe(sentinel);
}
function moveSentinelToBottom(){
  const sl = document.getElementById("scrollSentinel");
  const wrap = document.getElementById("resultList");
  if(sl && wrap){

const GD_API = "https://music-api.gdstudio.xyz/api.php";
const PLATFORM_MAP = { netease:"网易云", tencent:"QQ音乐", kuwo:"酷我", kugou:"酷狗", migu:"咪咕" };
const QUALITY_TO_BR = { "128k":"128", "192k":"192", "320k":"320", flac:"740", "24bit":"999" };
const FALLBACK_SOURCES = ["netease","tencent","kugou","kuwo","migu"];
const audio = document.getElementById("audio");

const prevPageBtn = document.getElementById('prevPageBtn');

let currentPlaylist = [];

const PAGE_SIZE = 30;

//进度条拖拽
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");
const curTimeDom = document.getElementById("curTime");
let isSeeking = false;
function getSeekRatio(evt){
    const rect = progressBar.getBoundingClientRect();
    let clientX;
    if(evt.touches && evt.touches.length>0){
        clientX = evt.touches[0].clientX;
    }else{
        clientX = evt.clientX;
    }
    let ratio = (clientX - rect.left) / rect.width;
    if(ratio < 0) ratio = 0;
    if(ratio > 1) ratio = 1;
    return ratio;
}
progressBar.addEventListener("mousedown",function(e){
    isSeeking = true;
    const r = getSeekRatio(e);
    if(audio.duration){
        progressFill.style.width = (r*100)+"%";
        curTimeDom.textContent = fmtTime(r * audio.duration);
    }
});
progressBar.addEventListener("touchstart",function(e){
    isSeeking = true;
    const r = getSeekRatio(e);
    if(audio.duration){
        progressFill.style.width = (r*100)+"%";
        curTimeDom.textContent = fmtTime(r * audio.duration);
    }
},{passive:true});
document.addEventListener("mousemove",function(e){
    if(!isSeeking) return;
    const r = getSeekRatio(e);
    if(audio.duration){
        progressFill.style.width = (r*100)+"%";
        curTimeDom.textContent = fmtTime(r * audio.duration);
    }
});
document.addEventListener("touchmove",function(e){
    if(!isSeeking) return;
    const r = getSeekRatio(e);

        progressFill.style.width = (r*100)+"%";

},{passive:true});
//松开拖拽：跳转时间，如果原本是播放状态，则继续播放
document.addEventListener("mouseup",function(e){
    if(!isSeeking) return;
    isSeeking = false;
    const r = getSeekRatio(e);
    if(audio.duration){
        audio.currentTime = r * audio.duration;
        if(isPlaying && audio.paused){
            audio.play().catch(function(){});
        }
    }
});
document.addEventListener("touchend",function(e){
    if(!isSeeking) return;
    isSeeking = false;
    const r = getSeekRatio(e);

        audio.currentTime = r * audio.duration;

});
function getCoverUrl(pic){
    if(!pic) return "";
    if(pic.startsWith("http://") || pic.startsWith("https://")){
        return pic;
    }

function updatePaginationButtons(listLength){

}
function resetAndSearch(){
    currentPage = 1;
    isAppendMode = false;
    document.getElementById("pageInfo").innerText = "第 "+currentPage+" 页";
    doSearch();
}
function pick(obj, keys, fallback) {
  if (obj == null) return fallback;
  for (const k of keys) {
    const v = obj[k];
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return fallback;
}
async function doSearch() {
  const kw = document.getElementById("searchInput").value.trim();
  if (!kw) { songNotice("请输入搜索关键词"); isLoadingMore=false; return; }
  if(!isAppendMode){
    resultList.innerHTML = '<div class="loading">⏳ 正在搜索 <b>'+escapeHtml(kw)+'</b> ...</div><div id="scrollSentinel"></div>';
  }else{
    const loadingTip = document.createElement("div");
    loadingTip.className="loading";
    loadingTip.innerText="加载更多歌曲...";
    resultList.appendChild(loadingTip);
  }
  prevPageBtn.disabled = true;
  nextPageBtn.disabled = false;
  try {
    const url = GD_API + "?types=search&source=" + currentSource + "&name=" + encodeURIComponent(kw) + "&count="+PAGE_SIZE+"&pages="+currentPage;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    document.getElementById("pageInfo").innerText = "第 "+currentPage+" 页";
    let list = Array.isArray(data) ? data
        : (data && (Array.isArray(data.data)   ? data.data   : null)) || null;
    if (list === null && data && typeof data === "object") {
      list = data.list || data.songs || data.result || data.results || null;
    }
    if (!list || !list.length) {
      if(!isAppendMode){
        resultList.innerHTML = '<div class="notice">😕 『'+PLATFORM_MAP[currentSource]+'』未找到相关歌曲，请换关键词或平台</div><div id="scrollSentinel"></div>';
      }else{
        const els = resultList.querySelectorAll(".loading");
        els.forEach(el=>el.remove());
      }
      updatePaginationButtons(0);
      isLoadingMore=false;
      initScrollInfinite();
      return;
    }
    const pageSongs = list.map((s, i) => ({
      id: String(pick(s, ["id","songid","song_id","rid","trackId","hash"], i)),
      title: pick(s, ["name","title","songname","song_name","audio_name","trackName"], "未知歌曲 " + (i+1)),
      artist: String(pick(s, ["artist","singer","singers","songer","artists","nickname","author"], "未知歌手")),
      pic: pick(s, ["pic_id","pic","picUrl","cover","albumPic","imgUrl","albumpic"], "") || "",
      album: pick(s, ["album","al","albumName"], ""),
      source: currentSource,
      sourceName: PLATFORM_MAP[currentSource] || currentSource,
      url: null
    }));
    if(isAppendMode){
      const els = resultList.querySelectorAll(".loading");
      els.forEach(el=>el.remove());
      currentPlaylist = currentPlaylist.concat(pageSongs);
      appendSongHtml(pageSongs);
    }else{
      currentPlaylist = pageSongs;
      renderList(currentPlaylist);
    }
    updatePaginationButtons(pageSongs.length);
  } catch(e) {
    if(!isAppendMode){
      resultList.innerHTML = '<div class="notice">❌ 搜索失败：'+escapeHtml(e.message || e)+'</div><div id="scrollSentinel"></div>';
    }else{
      songNotice("❌ 加载更多失败："+escapeHtml(e.message||e));
      const els = resultList.querySelectorAll(".loading");
      els.forEach(el=>el.remove());
    }
    updatePaginationButtons(0);
  }
  isLoadingMore = false;
  moveSentinelToBottom();
  initScrollInfinite();
}
function appendSongHtml(songArr){
  const frag = document.createDocumentFragment();
  const baseIdx = currentPlaylist.length - songArr.length;
  songArr.forEach((s, idx)=>{
    const realIndex = baseIdx + idx;
    const div = document.createElement("div");
    div.className = "song-item";
    div.dataset.index = realIndex;
    div.onclick = function(){
      playAt(realIndex);
    };
    const coverSrc = getCoverUrl(s.pic);
    div.innerHTML = `
      <div class="song-index-num">${realIndex+1}</div>
      ${coverSrc ? `<img class="song-cover" src="${escapeHtml(coverSrc)}" alt="" onerror="this.style.display='none'">` : `<div class="song-cover"></div>`}
      <div class="song-info">
        <div class="song-title">${escapeHtml(s.title)}</div>
        <div class="song-artist">${escapeHtml(s.artist)}${s.album?' · '+escapeHtml(s.album):''} · ${escapeHtml(s.sourceName)}</div>
      </div>
      <button class="icon-btn" data-download-idx="${realIndex}" onclick="event.stopPropagation();openDlModal(${realIndex})">⬇️</button>
    `;
    frag.appendChild(div);
  });
  resultList.appendChild(frag);
}
function nextPage() {
  if(nextPageBtn.disabled) return;

        </div>

}
function updatePlayingHighlight(){
  document.querySelectorAll(".song-item.playing").forEach(el=>el.classList.remove("playing"));

    if(item) item.classList.add("playing");

async function fetchUrl(song, source, id, br) {
  const url = GD_API + "?types=url&source=" + source + "&id=" + encodeURIComponent(id) + "&br=" + br;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const txt = await res.text();
  let data = null;
  try { data = JSON.parse(txt); } catch(e) { data = null; }
  if (typeof data === "string" && data.startsWith("http")) return data;
  if (data && typeof data === "object") {
    if (typeof data.url === "string" && data.url.startsWith("http")) return data.url;
    const d2 = data.data || data.result || data.payload;
    if (typeof d2 === "string" && d2.startsWith("http")) return d2;
    if (Array.isArray(d2) && d2[0]) {
      const u = pick(d2[0], ["url","play_url","src","file","audio"], "");
      if (u && u.startsWith("http")) return u;
    }
    if (Array.isArray(data) && data[0]) {
      const u = pick(data[0], ["url","play_url","src","file","audio"], "");
      if (u && u.startsWith("http")) return u;
    }
  }
  if (txt.trim().startsWith("http")) return txt.trim();
  throw new Error("无法解析播放地址");
}
async function resolveUrlCustomBr(song, brValue){
  const tried = [song.source].concat(FALLBACK_SOURCES.filter(s => s !== song.source));
  for (const src of tried) {
    try {
      const u = await fetchUrl(song, src, song.id, brValue);
      return u;
    } catch(e) { }
  }
  for (const src of FALLBACK_SOURCES) {
    try {
      const q = song.title + (song.artist && song.artist!=='未知歌手' ? " " + song.artist : "");
      const url = GD_API + "?types=search&source=" + src + "&name=" + encodeURIComponent(q) + "&count=5&pages=1";
      const res = await fetch(url);
      const data = await res.json();
      let list = Array.isArray(data) ? data : (data && data.data) || null;
      if (list && list.length) {
        const found = list[0];
        const id = String(pick(found, ["id","songid","song_id","rid","trackId","hash"], ""));
        if (id) {
          const u = await fetchUrl(song, src, id, brValue);
          if(u) return u;
        }
      }
    } catch(e){}
  }
  throw new Error("该音质无可用资源");
}
async function resolveUrl(song) {
  if (song.url) return song.url;
  const tried = [song.source].concat(FALLBACK_SOURCES.filter(s => s !== song.source));
  for (const src of tried) {
    try {
      const u = await fetchUrl(song, src, song.id, currentBr);
      song.url = u;
      song.usedSource = PLATFORM_MAP[src] || src;
      return u;
    } catch(e) { }
  }
  for (const src of FALLBACK_SOURCES) {
    if (src === song.source) continue;
    try {
      const q = song.title + (song.artist && song.artist!=='未知歌手' ? " " + song.artist : "");
      const url = GD_API + "?types=search&source=" + src + "&name=" + encodeURIComponent(q) + "&count=5&pages=1";
      const res = await fetch(url);
      const data = await res.json();
      let list = Array.isArray(data) ? data : (data && data.data) || null;
      if (list && list.length) {
        const found = list[0];
        const id = String(pick(found, ["id","songid","song_id","rid","trackId","hash"], ""));
        if (id) {
          const u = await fetchUrl(song, src, id, currentBr);
          if (u) {
            song.url = u;
            song.usedSource = PLATFORM_MAP[src] || src;
            song.title = pick(found, ["name","title","songname","song_name","trackName"], song.title);
            const ar = pick(found, ["artist","singer","singers","songer","artists","nickname"], song.artist);
            if (ar && ar !== "") song.artist = String(ar);
            return u;
          }
        }
      }
    } catch(e) { }
  }
  throw new Error("该曲在所有音源均未找到可播放资源");
}
async function playAt(i) {
  if(isPlayLock) return;
  const song = currentPlaylist[i];
  if (!song) return;
  isPlayLock = true;
  currentIndex = i;
  updatePlayingHighlight();
  document.getElementById("nowTitle").textContent = song.title;
  document.getElementById("nowArtist").textContent = song.artist + " · " + song.sourceName;
  try {
    const playUrl = await resolveUrl(song);
    audio.src = playUrl;
    audio.volume = document.getElementById("volumeSlider").value / 100;
    await audio.play();
    isPlaying = true;
    updatePlayBtn();
    document.getElementById("nowArtist").textContent = song.artist + " · " + (song.usedSource || song.sourceName);
  } catch(e) {
    audio.pause(); isPlaying = false; updatePlayBtn();
    songNotice("⚠️ " + (e.message || "播放失败"));
  }
  isPlayLock = false;
}
function togglePlay() {
  if (!audio.src) { songNotice("请先点选一首歌曲"); return; }
  if (audio.paused) { audio.play(); isPlaying = true; } else { audio.pause(); isPlaying = false; }
  updatePlayBtn();
}
function prevSong() {
  if (currentIndex > 0) playAt(currentIndex-1);
  else songNotice("已经是第一首");
}
function nextSong() {
  if (currentIndex < currentPlaylist.length-1) playAt(currentIndex+1);
  else songNotice("已经是最后一首");
}
function updatePlayBtn() { document.getElementById("playBtn").textContent = isPlaying ? "⏸️" : "▶️"; }
function setVolume(v) { audio.volume = v/100; document.getElementById("volumeVal").textContent = v + "%"; }
audio.addEventListener("timeupdate", () => {
  if(isSeeking) return;
  if (!audio.duration) return;
  document.getElementById("progressFill").style.width = (audio.currentTime/audio.duration*100) + "%";
  document.getElementById("curTime").textContent = fmtTime(audio.currentTime);

});
audio.addEventListener("ended", handleAudioEnded);
audio.addEventListener("error", () => { if (audio.src) songNotice("⚠️ 播放出错，尝试点击其他歌曲"); });
function fmtTime(s) {
  if (isNaN(s) || !isFinite(s)) return "0:00";
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return m + ":" + (sec<10?"0":"") + sec;
}
//================下载弹窗逻辑================
function openDlModal(idx){
  dlTargetSongIndex = idx;
  const song = currentPlaylist[idx];
  if(!song) return;
  document.getElementById("dlModalSongName").innerText = `${song.title} - ${song.artist}`;

function closeDlModal(){

}
document.getElementById("dlModalMask").addEventListener("click",function(e){
  if(e.target === this) closeDlModal();
});
function getSafeFileName(artist, title){
  const badChars = /[\\\/:*?"<>|]/g;
  const art = (artist || "未知歌手").replace(badChars,"_");
  const tit = (title || "未知歌曲").replace(badChars,"_");
  return `${art} - ${tit}.mp3`;
}
async function startDownloadWithQuality(idx, qualityLabel, brValue){
  const song = currentPlaylist[idx];
  if(!song) return;
  if(downloadingIndexSet.has(idx)){
    songNotice("正在下载，请稍候");
    return;
  }
  downloadingIndexSet.add(idx);
  const btn = document.querySelector(`.icon-btn[data-download-idx="${idx}"]`);
  if(btn) btn.disabled = true;
  try{
    songNotice(`⏳ 获取【${qualityLabel}】下载链接：${song.title}`);
    const realUrl = await resolveUrlCustomBr(song, brValue);
    const fileName = getSafeFileName(song.artist, song.title);
    const aEle = document.createElement("a");
    aEle.href = realUrl;
    aEle.download = fileName;
    document.body.appendChild(aEle);
    aEle.click();
    document.body.removeChild(aEle);
    songNotice(`✅ 已触发下载【${qualityLabel}】：${fileName}`);
  }catch(err){
    songNotice("❌ 获取该音质资源失败，可以尝试更低音质");
  }finally{
    downloadingIndexSet.delete(idx);
    const btn = document.querySelector(`.icon-btn[data-download-idx="${idx}"]`);
    if(btn) btn.disabled = false;
  }
}
async function downloadCurrentSong(){
  if(currentIndex <0 || !currentPlaylist[currentIndex]){
    songNotice("没有正在播放的歌曲");
    return;
  }
  openDlModal(currentIndex);
}
function renderQualityChips() {
  const chips = document.getElementById("qualityChips");
  chips.innerHTML = ["128k","192k","320k","flac","24bit"]
    .map(q => `<span class="quality-chip ${q===currentQuality?'active':''}" onclick="setQuality('${q}')">${q}</span>`).join("");
}
function setQuality(q) {
  currentQuality = q;
  currentBr = QUALITY_TO_BR[q];
  currentPlaylist.forEach(s => { s.url = null; });
  renderQualityChips();
  songNotice("音质已切换为 " + q + "，重新点击歌曲生效");
}
function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace( />/g,"&gt;").replace(/"/g,"&quot;"); }
function sanitize(s) { return String(s).replace(/[\\/:*?"<>|]/g, "_"); }
function songNotice(msg) {
  const old = document.querySelector(".temp-notice");

let prevAudioOutputList = [];
async function getAudioOutputDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d => d.kind === "audiooutput");
  } catch (e) {
    return [];
  }
}
async function onMediaDeviceChange() {
  const nowList = await getAudioOutputDevices();
  const hadHeadphoneBefore = prevAudioOutputList.some(item => /headphone|耳机/i.test(item.label));
  const hasHeadphoneNow = nowList.some(item => /headphone|耳机/i.test(item.label));
  if (hadHeadphoneBefore && !hasHeadphoneNow) {
    if(!audio.paused){
      audio.pause();
      isPlaying = false;
      updatePlayBtn();
    }
  }
  prevAudioOutputList = nowList;
}
async function initHeadphoneDetect() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
    return;
  }
  try {
    prevAudioOutputList = await getAudioOutputDevices();
    navigator.mediaDevices.addEventListener("devicechange", onMediaDeviceChange);
  } catch (err) {
  }

      const kw = document.getElementById("searchInput").value.trim();
      if(!kw) return;
      isLoadingMore = true;

  scrollObserver.observe(sentinel);
}

function getSeekRatio(evt){
    const rect = progressBar.getBoundingClientRect();

    if(evt.touches && evt.touches.length>0){
        clientX = evt.touches[0].clientX;
    }else{
        clientX = evt.clientX;
    }
    let ratio = (clientX - rect.left) / rect.width;
    if(ratio < 0) ratio = 0;
    if(ratio > 1) ratio = 1;
    return ratio;
}

},{passive:true});
//松开拖拽：跳转时间，如果原本是播放状态，则继续播放
document.addEventListener("mouseup",function(e){
    if(!isSeeking) return;
    isSeeking = false;
    const r = getSeekRatio(e);
    if(audio.duration){
        audio.currentTime = r * audio.duration;
        if(isPlaying && audio.paused){
            audio.play().catch(function(){});
        }
    }
});
document.addEventListener("touchend",function(e){
    if(!isSeeking) return;
    isSeeking = false;
    const r = getSeekRatio(e);
    if(audio.duration){
        audio.currentTime = r * audio.duration;
        if(isPlaying && audio.paused){
            audio.play().catch(function(){});
        }
    }
});
function getCoverUrl(pic){
    if(!pic) return "";
    if(pic.startsWith("http://") || pic.startsWith("https://")){
        return pic;
    }
    return "http://p1.music.126.net/" + pic + ".jpg";
}
function updatePaginationButtons(listLength){
    prevPageBtn.disabled = true;
    nextPageBtn.disabled = listLength < PAGE_SIZE;
}
function resetAndSearch(){
    currentPage = 1;
    isAppendMode = false;
    document.getElementById("pageInfo").innerText = "第 "+currentPage+" 页";
    doSearch();
}
function pick(obj, keys, fallback) {
  if (obj == null) return fallback;
  for (const k of keys) {
    const v = obj[k];
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return fallback;
}
async function doSearch() {
  const kw = document.getElementById("searchInput").value.trim();
  if (!kw) { songNotice("请输入搜索关键词"); isLoadingMore=false; return; }
  if(!isAppendMode){
    resultList.innerHTML = '<div class="loading">⏳ 正在搜索 <b>'+escapeHtml(kw)+'</b> ...</div><div id="scrollSentinel"></div>';
  }else{
    const loadingTip = document.createElement("div");
    loadingTip.className="loading";
    loadingTip.innerText="加载更多歌曲...";
    resultList.appendChild(loadingTip);
  }
  prevPageBtn.disabled = true;
  nextPageBtn.disabled = false;
  try {
    const url = GD_API + "?types=search&source=" + currentSource + "&name=" + encodeURIComponent(kw) + "&count="+PAGE_SIZE+"&pages="+currentPage;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    document.getElementById("pageInfo").innerText = "第 "+currentPage+" 页";
    let list = Array.isArray(data) ? data
        : (data && (Array.isArray(data.data)   ? data.data   : null)) || null;
    if (list === null && data && typeof data === "object") {
      list = data.list || data.songs || data.result || data.results || null;
    }
    if (!list || !list.length) {
      if(!isAppendMode){
        resultList.innerHTML = '<div class="notice">😕 『'+PLATFORM_MAP[currentSource]+'』未找到相关歌曲，请换关键词或平台</div><div id="scrollSentinel"></div>';
      }else{
        const els = resultList.querySelectorAll(".loading");
        els.forEach(el=>el.remove());
      }
      updatePaginationButtons(0);
      isLoadingMore=false;
      initScrollInfinite();
      return;
    }
    const pageSongs = list.map((s, i) => ({
      id: String(pick(s, ["id","songid","song_id","rid","trackId","hash"], i)),
      title: pick(s, ["name","title","songname","song_name","audio_name","trackName"], "未知歌曲 " + (i+1)),
      artist: String(pick(s, ["artist","singer","singers","songer","artists","nickname","author"], "未知歌手")),
      pic: pick(s, ["pic_id","pic","picUrl","cover","albumPic","imgUrl","albumpic"], "") || "",
      album: pick(s, ["album","al","albumName"], ""),
      source: currentSource,
      sourceName: PLATFORM_MAP[currentSource] || currentSource,
      url: null
    }));
    if(isAppendMode){
      const els = resultList.querySelectorAll(".loading");
      els.forEach(el=>el.remove());
      currentPlaylist = currentPlaylist.concat(pageSongs);
      appendSongHtml(pageSongs);
    }else{
      currentPlaylist = pageSongs;
      renderList(currentPlaylist);
    }
    updatePaginationButtons(pageSongs.length);
  } catch(e) {
    if(!isAppendMode){
      resultList.innerHTML = '<div class="notice">❌ 搜索失败：'+escapeHtml(e.message || e)+'</div><div id="scrollSentinel"></div>';
    }else{
      songNotice("❌ 加载更多失败："+escapeHtml(e.message||e));
      const els = resultList.querySelectorAll(".loading");
      els.forEach(el=>el.remove());
    }
    updatePaginationButtons(0);
  }
  isLoadingMore = false;
  moveSentinelToBottom();
  initScrollInfinite();
}
function appendSongHtml(songArr){
  const frag = document.createDocumentFragment();
  const baseIdx = currentPlaylist.length - songArr.length;
  songArr.forEach((s, idx)=>{
    const realIndex = baseIdx + idx;
    const div = document.createElement("div");
    div.className = "song-item";
    div.dataset.index = realIndex;
    div.onclick = function(){
      playAt(realIndex);
    };
    const coverSrc = getCoverUrl(s.pic);
    div.innerHTML = `
      <div class="song-index-num">${realIndex+1}</div>
      ${coverSrc ? `<img class="song-cover" src="${escapeHtml(coverSrc)}" alt="" onerror="this.style.display='none'">` : `<div class="song-cover"></div>`}
      <div class="song-info">
        <div class="song-title">${escapeHtml(s.title)}</div>
        <div class="song-artist">${escapeHtml(s.artist)}${s.album?' · '+escapeHtml(s.album):''} · ${escapeHtml(s.sourceName)}</div>
      </div>
      <button class="icon-btn" data-download-idx="${realIndex}" onclick="event.stopPropagation();openDlModal(${realIndex})">⬇️</button>
    `;
    frag.appendChild(div);
  });
  resultList.appendChild(frag);
}
function nextPage() {
  if(nextPageBtn.disabled) return;
  const kw = document.getElementById("searchInput").value.trim();
  if (!kw) { songNotice("请先输入搜索关键词"); isLoadingMore=false; return; }
  currentPage++;
  isAppendMode = true;
  doSearch();
}
function prevPage() {
  songNotice("无限滚动模式不支持上一页，请重新搜索");
}
function setPlatform(el) {
  document.querySelectorAll(".platform-tag").forEach(x => x.classList.remove("active"));
  el.classList.add("active");
  currentSource = el.getAttribute("data-p");
  currentPlaylist = []; currentIndex = -1;
  currentPage = 1;
  isAppendMode = false;
  downloadingIndexSet.clear();
  document.getElementById("pageInfo").innerText = "第 "+currentPage+" 页";
  audio.pause(); audio.removeAttribute("src"); isPlaying = false; updatePlayBtn();
  resultList.innerHTML = '<div class="notice">已切换到 『'+el.textContent+'』，请输入关键词重新搜索</div><div id="scrollSentinel"></div>';
  prevPageBtn.disabled = true;
  nextPageBtn.disabled = true;
  isLoadingMore = false;
  initScrollInfinite();
}
document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    resetAndSearch();
  }
});
function renderList(list) {
  if (!list.length) return;
  downloadingIndexSet.clear();
  let html = '';
  list.forEach((s, i) => {
    const coverSrc = getCoverUrl(s.pic);
    html += `
      <div class="song-item" data-index="${i}" onclick="playAt(${i})">
        <div class="song-index-num">${i+1}</div>
        ${coverSrc ?
            `<img class="song-cover" src="${escapeHtml(coverSrc)}" alt="" onerror="this.style.display='none'">`
            : `<div class="song-cover"></div>`
        }
        <div class="song-info">
          <div class="song-title">${escapeHtml(s.title)}</div>
          <div class="song-artist">${escapeHtml(s.artist)}${s.album?' · '+escapeHtml(s.album):''} · ${escapeHtml(s.sourceName)}</div>
        </div>
        <button class="icon-btn" data-download-idx="${i}" onclick="event.stopPropagation();openDlModal(${i})">⬇️</button>
      </div>`;
  });
  html += `<div id="scrollSentinel"></div>`;
  resultList.innerHTML = html;
  updatePlayingHighlight();
}
function updatePlayingHighlight(){
  document.querySelectorAll(".song-item.playing").forEach(el=>el.classList.remove("playing"));
  if(currentIndex >=0 && currentPlaylist[currentIndex]){
    const item = document.querySelector(`.song-item[data-index="${currentIndex}"]`);
    if(item) item.classList.add("playing");
  }
}
async function fetchUrl(song, source, id, br) {
  const url = GD_API + "?types=url&source=" + source + "&id=" + encodeURIComponent(id) + "&br=" + br;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const txt = await res.text();
  let data = null;
  try { data = JSON.parse(txt); } catch(e) { data = null; }
  if (typeof data === "string" && data.startsWith("http")) return data;
  if (data && typeof data === "object") {
    if (typeof data.url === "string" && data.url.startsWith("http")) return data.url;
    const d2 = data.data || data.result || data.payload;
    if (typeof d2 === "string" && d2.startsWith("http")) return d2;
    if (Array.isArray(d2) && d2[0]) {
      const u = pick(d2[0], ["url","play_url","src","file","audio"], "");
      if (u && u.startsWith("http")) return u;
    }
    if (Array.isArray(data) && data[0]) {
      const u = pick(data[0], ["url","play_url","src","file","audio"], "");
      if (u && u.startsWith("http")) return u;
    }
  }
  if (txt.trim().startsWith("http")) return txt.trim();
  throw new Error("无法解析播放地址");
}
async function resolveUrlCustomBr(song, brValue){
  const tried = [song.source].concat(FALLBACK_SOURCES.filter(s => s !== song.source));
  for (const src of tried) {
    try {
      const u = await fetchUrl(song, src, song.id, brValue);
      return u;
    } catch(e) { }
  }
  for (const src of FALLBACK_SOURCES) {
    try {
      const q = song.title + (song.artist && song.artist!=='未知歌手' ? " " + song.artist : "");
      const url = GD_API + "?types=search&source=" + src + "&name=" + encodeURIComponent(q) + "&count=5&pages=1";
      const res = await fetch(url);
      const data = await res.json();
      let list = Array.isArray(data) ? data : (data && data.data) || null;
      if (list && list.length) {
        const found = list[0];
        const id = String(pick(found, ["id","songid","song_id","rid","trackId","hash"], ""));
        if (id) {
          const u = await fetchUrl(song, src, id, brValue);
          if(u) return u;
        }
      }
    } catch(e){}
  }
  throw new Error("该音质无可用资源");
}
async function resolveUrl(song) {
  if (song.url) return song.url;
  const tried = [song.source].concat(FALLBACK_SOURCES.filter(s => s !== song.source));
  for (const src of tried) {
    try {
      const u = await fetchUrl(song, src, song.id, currentBr);
      song.url = u;
      song.usedSource = PLATFORM_MAP[src] || src;
      return u;
    } catch(e) { }
  }
  for (const src of FALLBACK_SOURCES) {
    if (src === song.source) continue;
    try {
      const q = song.title + (song.artist && song.artist!=='未知歌手' ? " " + song.artist : "");
      const url = GD_API + "?types=search&source=" + src + "&name=" + encodeURIComponent(q) + "&count=5&pages=1";
      const res = await fetch(url);
      const data = await res.json();
      let list = Array.isArray(data) ? data : (data && data.data) || null;
      if (list && list.length) {
        const found = list[0];
        const id = String(pick(found, ["id","songid","song_id","rid","trackId","hash"], ""));
        if (id) {
          const u = await fetchUrl(song, src, id, currentBr);
          if (u) {
            song.url = u;
            song.usedSource = PLATFORM_MAP[src] || src;
            song.title = pick(found, ["name","title","songname","song_name","trackName"], song.title);
            const ar = pick(found, ["artist","singer","singers","songer","artists","nickname"], song.artist);
            if (ar && ar !== "") song.artist = String(ar);
            return u;
          }
        }
      }
    } catch(e) { }
  }
  throw new Error("该曲在所有音源均未找到可播放资源");
}
async function playAt(i) {
  if(isPlayLock) return;
  const song = currentPlaylist[i];
  if (!song) return;
  isPlayLock = true;
  currentIndex = i;
  updatePlayingHighlight();
  document.getElementById("nowTitle").textContent = song.title;
  document.getElementById("nowArtist").textContent = song.artist + " · " + song.sourceName;
  try {
    const playUrl = await resolveUrl(song);
    audio.src = playUrl;
    audio.volume = document.getElementById("volumeSlider").value / 100;
    await audio.play();
    isPlaying = true;
    updatePlayBtn();
    document.getElementById("nowArtist").textContent = song.artist + " · " + (song.usedSource || song.sourceName);
  } catch(e) {
    audio.pause(); isPlaying = false; updatePlayBtn();
    songNotice("⚠️ " + (e.message || "播放失败"));
  }
  isPlayLock = false;
}
function togglePlay() {
  if (!audio.src) { songNotice("请先点选一首歌曲"); return; }
  if (audio.paused) { audio.play(); isPlaying = true; } else { audio.pause(); isPlaying = false; }
  updatePlayBtn();
}
function prevSong() {
  if (currentIndex > 0) playAt(currentIndex-1);
  else songNotice("已经是第一首");
}
function nextSong() {
  if (currentIndex < currentPlaylist.length-1) playAt(currentIndex+1);
  else songNotice("已经是最后一首");
}
function updatePlayBtn() { document.getElementById("playBtn").textContent = isPlaying ? "⏸️" : "▶️"; }
function setVolume(v) { audio.volume = v/100; document.getElementById("volumeVal").textContent = v + "%"; }
audio.addEventListener("timeupdate", () => {
  if(isSeeking) return;
  if (!audio.duration) return;
  document.getElementById("progressFill").style.width = (audio.currentTime/audio.duration*100) + "%";
  document.getElementById("curTime").textContent = fmtTime(audio.currentTime);
  document.getElementById("totalTime").textContent = fmtTime(audio.duration);
});
audio.addEventListener("ended", handleAudioEnded);
audio.addEventListener("error", () => { if (audio.src) songNotice("⚠️ 播放出错，尝试点击其他歌曲"); });
function fmtTime(s) {
  if (isNaN(s) || !isFinite(s)) return "0:00";
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return m + ":" + (sec<10?"0":"") + sec;
}
//================下载弹窗逻辑================
function openDlModal(idx){
  dlTargetSongIndex = idx;
  const song = currentPlaylist[idx];
  if(!song) return;
  document.getElementById("dlModalSongName").innerText = `${song.title} - ${song.artist}`;
  const listDom = document.getElementById("dlQualityList");
  listDom.innerHTML = "";
  DL_QUALITY_LIST.forEach(q=>{
    const brVal = QUALITY_TO_BR[q];
    const div = document.createElement("div");
    div.className = "dl-quality-item";
    div.innerText = q;
    div.onclick = ()=>{
      closeDlModal();
      startDownloadWithQuality(idx, q, brVal);
    };
    listDom.appendChild(div);
  });
  document.getElementById("dlModalMask").classList.add("open");
}
function closeDlModal(){
  document.getElementById("dlModalMask").classList.remove("open");
}
document.getElementById("dlModalMask").addEventListener("click",function(e){
  if(e.target === this) closeDlModal();
});
function getSafeFileName(artist, title){
  const badChars = /[\\\/:*?"<>|]/g;
  const art = (artist || "未知歌手").replace(badChars,"_");
  const tit = (title || "未知歌曲").replace(badChars,"_");
  return `${art} - ${tit}.mp3`;
}
async function startDownloadWithQuality(idx, qualityLabel, brValue){
  const song = currentPlaylist[idx];
  if(!song) return;
  if(downloadingIndexSet.has(idx)){
    songNotice("正在下载，请稍候");
    return;
  }
  downloadingIndexSet.add(idx);
  const btn = document.querySelector(`.icon-btn[data-download-idx="${idx}"]`);
  if(btn) btn.disabled = true;
  try{
    songNotice(`⏳ 获取【${qualityLabel}】下载链接：${song.title}`);
    const realUrl = await resolveUrlCustomBr(song, brValue);
    const fileName = getSafeFileName(song.artist, song.title);
    const aEle = document.createElement("a");
    aEle.href = realUrl;
    aEle.download = fileName;
    document.body.appendChild(aEle);
    aEle.click();
    document.body.removeChild(aEle);
    songNotice(`✅ 已触发下载【${qualityLabel}】：${fileName}`);
  }catch(err){
    songNotice("❌ 获取该音质资源失败，可以尝试更低音质");
  }finally{
    downloadingIndexSet.delete(idx);
    const btn = document.querySelector(`.icon-btn[data-download-idx="${idx}"]`);
    if(btn) btn.disabled = false;
  }
}
async function downloadCurrentSong(){
  if(currentIndex <0 || !currentPlaylist[currentIndex]){
    songNotice("没有正在播放的歌曲");
    return;
  }
  openDlModal(currentIndex);
}
function renderQualityChips() {
  const chips = document.getElementById("qualityChips");
  chips.innerHTML = ["128k","192k","320k","flac","24bit"]
    .map(q => `<span class="quality-chip ${q===currentQuality?'active':''}" onclick="setQuality('${q}')">${q}</span>`).join("");
}
function setQuality(q) {
  currentQuality = q;
  currentBr = QUALITY_TO_BR[q];
  currentPlaylist.forEach(s => { s.url = null; });
  renderQualityChips();
  songNotice("音质已切换为 " + q + "，重新点击歌曲生效");
}
function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace( />/g,"&gt;").replace(/"/g,"&quot;"); }
function sanitize(s) { return String(s).replace(/[\\/:*?"<>|]/g, "_"); }
function songNotice(msg) {
  const old = document.querySelector(".temp-notice");
  if (old) old.remove();
  const d = document.createElement("div");
  d.className = "notice temp-notice";
  d.textContent = msg;
  resultList.prepend(d);
  setTimeout(()=>{d.remove();},3500);
}
function toggleDrawer() { document.getElementById("controlsDrawer").classList.toggle("open"); }

  renderQualityChips();
  renderSingerList();
  audio.volume = 0.8;
  prevPageBtn.disabled = true;
  nextPageBtn.disabled = true;

  document.getElementById("modeBtn").title = modeTips[currentPlayMode];
  initScrollInfinite();

  //页面加载完毕自动填入流行，自动搜索
  document.getElementById("searchInput").value = "流行";
  resetAndSearch();
})();
